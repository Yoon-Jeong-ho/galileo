name: latex-smoketest

on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/paper/latex_skeleton/**'
      - 'paper_figures/pdf/**'
      - '.github/workflows/latex_smoketest.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install TeX (minimal)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended \
            latexmk

      - name: Build LaTeX skeleton
        working-directory: docs/paper/latex_skeleton
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: latex_skeleton_pdf
          path: docs/paper/latex_skeleton/main.pdf
          if-no-files-found: error
